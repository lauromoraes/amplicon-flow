[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ampliconflow"
version = "2.0.0-dev0"
description = "Notebook-centered, reproducible ampliconflowe analysis pipeline using QIIME 2 and Papermill."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.0", "nbformat>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[project.scripts]
ampliconflow = "ampliconflow.cli:main"
