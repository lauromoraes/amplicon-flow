name: quality
on: [push, pull_request]
jobs:
  structural-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Reject tracked QIIME 2 artifacts
        run: python -m ampliconflow.repository_policy
      - run: pytest
      - run: ruff check src tests
      - run: bash -n ampliconflow
